<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Survivors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="startScreen" class="start-screen">
    <div class="start-content">
      <div class="start-title">
        <span class="title-word title-pixel">PIXEL</span>
        <span class="title-word title-survivors">SURVIVORS</span>
      </div>
      <p class="start-sub">Top-down survivor prototype</p>
      <button id="playBtn" class="play-btn" type="button">PLAY</button>
    </div>
  </div>

  <div id="loadingScreen" class="loading-screen hidden" aria-live="polite">
    <div class="loading-card">
      <p class="eyebrow">Loading</p>
      <h2>PIXEL SURVIVORS</h2>
      <p class="loading-copy">Preparing the arena…</p>
      <div class="loading-bar"><span></span></div>
      <!-- New canvas element for particle effects -->
      <canvas id="particleCanvas" width="900" height="600" style="position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1;"></canvas>
    </div>
  </div>

  <main class="app-shell">
    <!-- ... existing content ... -->
  </main>

  <script src="game.js"></script>
  <script src="loading-effects.js"></script>
</body>
</html>
